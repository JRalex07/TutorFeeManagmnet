name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release (for tag/manual runs)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Setup Firebase Configuration
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Writing app/google-services.json from GitHub Secrets..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ ! -f "app/google-services.json" ]; then
            echo "app/google-services.json not found in repository; writing fallback configuration..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "178832773306",
    "project_id": "gen-lang-client-0339105045",
    "storage_bucket": "gen-lang-client-0339105045.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:178832773306:android:441e818caa984f5f04f283",
        "android_client_info": {
          "package_name": "com.managment.tutorfee"
        }
      },
      "oauth_client": [
        {
          "client_id": "178832773306-6kssf5rgfnlocekerkdhbe2gfv982tml.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.managment.tutorfee",
            "certificate_hash": "648b0a132c3a1ca76aafda410f2cd374d5bf818a"
          }
        },
        {
          "client_id": "178832773306-597qdfa7i8mpdvdunp7p8grmq53vsdao.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyAaUl1WtgIEDIdq-Fm2HM1axgprZyXNB7A"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "178832773306-597qdfa7i8mpdvdunp7p8grmq53vsdao.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Prepare Signing Keystores (Release & Debug)
        id: setup_keystore
        run: |
          # 1. Setup debug.keystore (required by debugConfig)
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for debug builds..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi

          # 2. Setup release keystore (my-upload-key.jks)
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating release keystore for build artifact..."
            STORE_PASS="${{ secrets.STORE_PASSWORD || 'android123' }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD || 'android123' }}"
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=TuitionLedger, OU=Release, O=TutorUtility, L=City, ST=State, C=IN"
          fi

      - name: Build Release and Debug APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Inspect Build Artifacts
        run: |
          echo "Listing generated APKs:"
          ls -la app/build/outputs/apk/release/ || true
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuition-ledger-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuition-ledger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
