name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release (for tag/manual runs)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Environment Files
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Setup Firebase Configuration
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Setting up app/google-services.json from GitHub Secrets..."
            # Check if secret is base64 encoded
            if echo "$GOOGLE_SERVICES_SECRET" | base64 -d >/dev/null 2>&1 && [[ "$GOOGLE_SERVICES_SECRET" != *"{"* ]]; then
              echo "$GOOGLE_SERVICES_SECRET" | base64 -d > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
            fi
          elif [ ! -s "app/google-services.json" ]; then
            echo "app/google-services.json not found in repository; writing fallback configuration..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "178832773306",
    "project_id": "gen-lang-client-0339105045",
    "storage_bucket": "gen-lang-client-0339105045.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:178832773306:android:441e818caa984f5f04f283",
        "android_client_info": {
          "package_name": "com.managment.tutorfee"
        }
      },
      "oauth_client": [
        {
          "client_id": "178832773306-6kssf5rgfnlocekerkdhbe2gfv982tml.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.managment.tutorfee",
            "certificate_hash": "648b0a132c3a1ca76aafda410f2cd374d5bf818a"
          }
        },
        {
          "client_id": "178832773306-597qdfa7i8mpdvdunp7p8grmq53vsdao.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyAaUl1WtgIEDIdq-Fm2HM1axgprZyXNB7A"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "178832773306-597qdfa7i8mpdvdunp7p8grmq53vsdao.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
          echo "Verified app/google-services.json (size: $(wc -c < app/google-services.json) bytes):"
          head -n 5 app/google-services.json

      - name: Prepare Signing Keystores (Release & Debug)
        id: setup_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Setup debug.keystore (required by debugConfig)
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore for debug builds..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          # Duplicate to app/ folder to guarantee path resolution
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          # 2. Determine release keystore passwords with reliable defaults
          STORE_PASS="${STORE_PASSWORD_SECRET:-android123}"
          KEY_PASS="${KEY_PASSWORD_SECRET:-android123}"

          # 3. Setup release keystore (my-upload-key.jks)
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks 2>/dev/null || echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          fi

          if [ ! -s "my-upload-key.jks" ]; then
            echo "Generating release keystore (my-upload-key.jks)..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=TuitionLedger, OU=Release, O=TutorUtility, L=City, ST=State, C=IN"
          fi
          # Duplicate to app/ folder to guarantee path resolution
          cp my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

          # Export keystore credentials globally to subsequent steps via GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Inspect Build Artifacts
        run: |
          echo "Listing generated APKs:"
          ls -la app/build/outputs/apk/release/ || true
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuition-ledger-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuition-ledger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
